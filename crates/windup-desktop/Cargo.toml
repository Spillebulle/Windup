[package]
name = "windup-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "windup"
path = "src/main.rs"

[features]
default = ["pipewire"]
pipewire = ["dep:pipewire"]

[dependencies]
windup-core = { workspace = true }
windup-ui = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
wgpu = { workspace = true }
env_logger = { workspace = true }
log = { workspace = true }
global-hotkey = "0.8.0"
enigo = "0.6.1"
clipboard-rs = "0.3.5"
image = { workspace = true }
jiff = "0.2.35"
serde = { workspace = true }
serde_json = { workspace = true }

# Linux: our own Wayland connection for data-control, the virtual keyboard and
# the layer-shell popup (egui drawn through egui-wgpu, as eframe does), and
# x11rb for the pointer and focus on X11. See docs/linux.md.
[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = "0.20"
calloop = "0.14"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
raw-window-handle = "0.6"
egui-wgpu = "0.32"
pollster = "0.4"
x11rb = { version = "0.13", features = ["randr", "xinput"] }
rustix = { version = "1", features = ["fs", "process", "pipe", "event"] }
# The same portal client and runtime rfd already brings in.
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
futures-util = "0.3"
# The very zbus ashpd uses (one version in Cargo.lock); the `interface` macro
# names the crate, so it cannot go through ashpd::zbus.
zbus = { version = "5.19", default-features = false, features = ["async-io"] }
# Screen recording on KDE and GNOME: the ScreenCast portal hands over PipeWire
# streams. Behind the `pipewire` feature because its bindings need libclang
# and libpipewire headers, which a cross build from Windows does not have.
pipewire = { version = "0.8", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

# Computer sound (WASAPI loopback) and the microphone on Windows.
[target.'cfg(windows)'.dependencies.cpal]
version = "0.16"

# Compiles the icon and version information into windup.exe; see build.rs.
# Selected on the host triple, which is what a resource compiler is.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
