name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The packaging files are otherwise only exercised when a release is built,
  # which is the worst moment to find a typo: the tag is already pushed.
  packaging:
    name: packaging files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse
        run: |
          python3 - <<'PY'
          import glob, sys, xml.dom.minidom, yaml
          bad = False
          for f in glob.glob('packaging/*/*.wxs') + glob.glob('packaging/*/*.xml'):
              try:
                  xml.dom.minidom.parse(f)
              except Exception as e:
                  bad = True
                  print(f'{f}: {e}')
          for f in glob.glob('.github/workflows/*.yml'):
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
              except Exception as e:
                  bad = True
                  print(f'{f}: {e}')
          sys.exit(1 if bad else 0)
          PY

      - name: Shell syntax
        run: |
          for f in packaging/*/*.sh tools/*.sh; do
            bash -n "$f"
          done

      # The desktop entry, the AppStream file and the icons must agree on the
      # app id, or software centres drop the whole component.
      - name: Linux metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream
          desktop-file-validate packaging/io.github.spillebulle.windup.desktop
          appstreamcli validate --no-net packaging/io.github.spillebulle.windup.metainfo.xml
          sh packaging/check.sh

  # Builds every Linux package from a debug binary, so a mistake in
  # package.sh shows up on the push that made it rather than on the tag.
  linux-packages:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-packages

      - name: Build
        run: |
          sh packaging/linux/dependencies.sh
          sudo apt-get install -y rpm
          cargo build -p windup-desktop
          sh tools/fetch-ffmpeg.sh linux64 target/debug

      - name: Package
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          sh packaging/linux/package.sh "$version" amd64 target/debug dist
          readelf -d target/debug/windup | grep NEEDED
          dpkg-deb --info dist/*.deb
          rpm -qpR dist/*.rpm

      # Installs the packages in clean distributions: the dependency lists are
      # hand-written, so this is what proves they resolve. Each one must also
      # enrol the machine as Spillebulle/packages ENROLMENT.md says and then
      # read the live archive with the key it put there. Debian also installs
      # a second enrolling package, and upgrades a machine enrolled the old way.
      - name: Install on Debian, Fedora and Arch
        run: |
          check="sh /src/packaging/linux/check-enrolment.sh"
          mounts="-v $PWD/dist:/dist -v $PWD:/src:ro"
          docker run --rm $mounts debian:12 $check deb /dist
          docker run --rm $mounts debian:12 $check deb-legacy /dist
          docker run --rm $mounts fedora:41 $check rpm /dist
          docker run --rm $mounts archlinux:latest $check arch /dist
          chmod +x dist/*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 dist/*.AppImage --help

      # For trying a branch on a real desktop before it is released.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist
          retention-days: 14

  # Every target the release builds is built here too, so a green CI on the
  # commit being tagged means the release will build. Adding a row to
  # release.yml's matrix means adding it here in the same commit.
  #
  # ARM64 Windows is cross-compiled on the x64 runner: this repository is
  # private, and GitHub's ARM runners are only free for public ones. It is
  # built but cannot be tested.
  check:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, test: true }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, test: false }
          # Not released yet, but CLAUDE.md promises the crates compile here,
          # and this is what keeps that true until there is a Linux package.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, test: true }

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sh packaging/linux/dependencies.sh

      - name: Format
        if: matrix.test
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }}

      - name: Test
        if: matrix.test
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.test }}
        run: cargo build --release -p windup-desktop --target ${{ matrix.target }}

      # The pinned FFmpeg must still download, match its checksum and offer
      # the encoders the recorder needs.
      - name: FFmpeg encoders
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          sh tools/fetch-ffmpeg.sh win64 target/ff
          WINDUP_FFMPEG="$PWD/target/ff/ffmpeg.exe" cargo run -p windup-desktop --target ${{ matrix.target }} -- --encoders-test

  # Windup driven for real on Linux with no screen: a headless Sway for
  # Wayland (the protocols COSMIC, KDE and wlroots share) and Xvfb for X11.
  # tools/linux-e2e.sh says what each case checks. lavapipe stands in for a
  # GPU, so the popup is really drawn; the screenshots are kept.
  e2e:
    name: end-to-end (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e

      - name: Install dependencies
        run: |
          sh packaging/linux/dependencies.sh
          sudo apt-get install -y sway swaybg wl-clipboard wtype grim zenity             xvfb x11-utils xdotool xclip openbox imagemagick mesa-vulkan-drivers python3-gi gir1.2-gtk-4.0 weston xwayland

      - name: Build
        run: cargo build -p windup-desktop

      # Next to the binary, where Windup looks first. ffprobe is only for
      # the cases that inspect what they recorded.
      - name: FFmpeg
        run: sh tools/fetch-ffmpeg.sh linux64 target/debug --with-ffprobe

      - name: Run
        run: bash tools/linux-e2e.sh target/debug/windup all e2e-artefacts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artefacts
          path: e2e-artefacts
