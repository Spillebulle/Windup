name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The packaging files are otherwise only exercised when a release is built,
  # which is the worst moment to find a typo: the tag is already pushed.
  packaging:
    name: packaging files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Parse
        run: |
          python3 - <<'PY'
          import glob, sys, xml.dom.minidom, yaml
          bad = False
          for f in glob.glob('packaging/*/*.wxs') + glob.glob('packaging/*/*.xml'):
              try:
                  xml.dom.minidom.parse(f)
              except Exception as e:
                  bad = True
                  print(f'{f}: {e}')
          for f in glob.glob('.github/workflows/*.yml'):
              try:
                  yaml.safe_load(open(f, encoding='utf-8'))
              except Exception as e:
                  bad = True
                  print(f'{f}: {e}')
          sys.exit(1 if bad else 0)
          PY

      - name: Shell syntax
        run: |
          for f in packaging/*/*.sh tools/*.sh; do
            bash -n "$f"
          done

  # Every target the release builds is built here too, so a green CI on the
  # commit being tagged means the release will build. Adding a row to
  # release.yml's matrix means adding it here in the same commit.
  #
  # ARM64 Windows is cross-compiled on the x64 runner: this repository is
  # private, and GitHub's ARM runners are only free for public ones. It is
  # built but cannot be tested.
  check:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, test: true }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, test: false }
          # Not released yet, but CLAUDE.md promises the crates compile here,
          # and this is what keeps that true until there is a Linux package.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, test: true }

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sh packaging/linux/dependencies.sh

      - name: Format
        if: matrix.test
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }}

      - name: Test
        if: matrix.test
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.test }}
        run: cargo build --release -p windup-desktop --target ${{ matrix.target }}
